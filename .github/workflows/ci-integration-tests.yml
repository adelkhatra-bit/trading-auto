name: CI Integration Tests

on:
  push:
    branches: [main, feature/**, deploy/**]
    paths:
      - "server.js"
      - "server-manager.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci-integration-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "server-manager.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci-integration-tests.yml"

jobs:
  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check (only when a lint script is defined)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script defined — skipped"
          fi

      - name: Start backend in isolated safe mode for smoke tests
        env:
          PORT: "4400"
          SAFE_MODE: "1"
          BROKER_MODE: "paper"
        run: |
          npm start > /tmp/trading-auto-server.log 2>&1 &
          echo $! > /tmp/trading-auto-server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4400/health > /tmp/trading-auto-health.json; then
              cat /tmp/trading-auto-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trading-auto-server.log
          exit 1

      - name: Run backend smoke tests
        run: BASE_URL=http://127.0.0.1:4400 bash tests/integration/backend-smoke.test.sh

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/trading-auto-server.pid ]; then
            kill "$(cat /tmp/trading-auto-server.pid)" 2>/dev/null || true
          fi
