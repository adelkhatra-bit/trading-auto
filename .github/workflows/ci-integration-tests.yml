name: CI Integration Tests

on:
  push:
    branches: [main, feature/**, deploy/**]
  pull_request:
    branches: [main]

jobs:
  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint check (if eslint exists)
        run: npm run lint || echo "No lint script defined"
        continue-on-error: true

      - name: Start backend for smoke tests
        run: |
          PORT=4400 npm start > /tmp/trading-auto-server.log 2>&1 &
          echo $! > /tmp/trading-auto-server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4400/health > /tmp/trading-auto-health.json; then
              cat /tmp/trading-auto-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trading-auto-server.log
          exit 1

      - name: Run backend smoke tests
        run: BASE_URL=http://127.0.0.1:4400 bash tests/integration/backend-smoke.test.sh

      - name: Health check
        run: |
          echo "Integration tests completed successfully"
        continue-on-error: true

      - name: Report test results
        if: always()
        run: echo "CI Pipeline Completed"
