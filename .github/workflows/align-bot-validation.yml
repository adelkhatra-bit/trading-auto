name: ALIGN MTF validation

on:
  workflow_call:
  push:
    branches:
      - main
      - "fix/align-*"
    paths:
      - "align-bot/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "align-bot/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q align-bot
      - name: Prepare Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Validate ALIGN workflow with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/align-bot-validation.yml .github/workflows/align-bot.yml .github/workflows/align-bot-rollover.yml
      - name: Run complete MTF regression suite
        run: python -m unittest discover -s align-bot -p "test_*.py" -v
