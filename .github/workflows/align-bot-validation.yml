name: ALIGN MTF validation

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "align-bot/**"
      - ".github/workflows/align-bot-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "align-bot/**"
      - ".github/workflows/align-bot-validation.yml"
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every Python file before importing tests
        run: python -m compileall -q align-bot
      - name: Compile bot and AI healthcheck
        run: python -m py_compile align-bot/align_bot.py align-bot/ai_healthcheck.py
      - name: Run MTF regression tests
        run: python -m unittest discover -s align-bot -p "test_*.py" -v
