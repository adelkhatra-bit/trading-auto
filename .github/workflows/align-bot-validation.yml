name: ALIGN MTF validation

on:
  push:
    branches:
      - main
      - "fix/align-*"
    paths:
      - "align-bot/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "align-bot/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files once
        run: python -m compileall -q align-bot
      - name: Prepare Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Validate GitHub Actions workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/*.yml
      - name: Run MTF regression tests
        run: python -m unittest discover -s align-bot -p "test_*.py" -v
