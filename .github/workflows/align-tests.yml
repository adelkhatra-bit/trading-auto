name: ALIGN regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "align-bot/**"
      - ".github/workflows/align-bot.yml"
      - ".github/workflows/align-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: align-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: align-bot
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot
        run: python -m py_compile align_bot.py
      - name: Run regression suite
        run: python -m unittest -v test_align_mtf.py
