name: ALIGN MTF BOT (signaux BTC + Gold Telegram)

on:
  push:                     # chaque mise à jour du bot le redémarre tout seul avec la nouvelle version
    branches: [main]
    paths: ["align-bot/**", ".github/workflows/align-bot.yml"]
  schedule:
    - cron: "*/5 * * * *"   # relance de secours : si le bot s'arrête, il repart en moins de 5 min
  workflow_dispatch:        # bouton « Run workflow » pour tester à la main

concurrency:
  group: align-bot
  cancel-in-progress: ${{ github.event_name != 'schedule' }}   # mise à jour ou lancement manuel = remplace l'ancien bot ; la relance de secours attend son tour

jobs:
  signaux:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # chaque lancement tourne 5 h 40 en continu (dépôt public = minutes GitHub gratuites)
    defaults:
      run:
        working-directory: align-bot
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: align-bot
      - name: Récupérer la mémoire du robot
        uses: actions/cache/restore@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
          restore-keys: align-etat-
      - name: Analyse BTC + Gold et envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DUREE_SEC: "20400"     # 5 h 40 : le bot reste allumé, une analyse BTC + Gold par minute
          PAUSE_SEC: "20"
        run: python3 align_bot.py
      - name: Sauver la mémoire du robot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
