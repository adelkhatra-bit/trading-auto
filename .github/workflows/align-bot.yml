name: ALIGN MTF BOT (signaux BTC + Gold Telegram)

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "align-bot/**"
      - ".github/workflows/align-bot.yml"
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: align-bot
  # Un seul worker : un déploiement arrête l'ancienne version avant de démarrer la nouvelle.
  # Le bot sauvegarde son état pendant le polling et l'étape cache s'exécute aussi à l'annulation.
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/align-bot-validation.yml

  signaux:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: align-bot
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: align-bot

      - name: Récupérer la mémoire du robot
        uses: actions/cache/restore@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
          restore-keys: align-etat-

      - name: Vérifier la connexion à Telegram sans envoyer de message
        working-directory: align-bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          if not token:
              raise SystemExit("ÉCHEC: secret TELEGRAM_TOKEN absent")
          url = "https://api.telegram.org/bot" + token + "/getMe"
          req = urllib.request.Request(url)
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode())
          if not payload.get("ok"):
              raise SystemExit("ÉCHEC: API Telegram indisponible")
          print("TELEGRAM_API_OK bot=@" + payload["result"].get("username", "unknown"))
          print("Aucun message de démarrage envoyé aux utilisateurs.")
          PY

      - name: Vérifier une connexion IA réelle (même chaîne que le bot)
        # Pas de démarrage production si aucun fournisseur IA externe ne répond : pas de faux avis IA.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 ai_healthcheck.py

      - name: Vérifier le bridge TradingView ROBOT V12 (BTC + GOLD)
        # Le moteur interne reste disponible, mais le statut bridge est explicite et jamais présenté comme connecté si absent ou périmé.
        env:
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          base = os.environ.get("ALIGN_TV_API_URL", "").strip().rstrip("/")
          token = os.environ.get("ALIGN_TV_READ_TOKEN", "").strip()
          status = "CONNECTED"
          details = []
          if not base or not token:
              status = "NOT_CONFIGURED"
              details.append("Secrets ALIGN_TV_API_URL / ALIGN_TV_READ_TOKEN absents.")
          else:
              for symbol in ("BTCUSD", "XAUUSD"):
                  try:
                      url = base + "/bridge/robot-v12/mtf?symbol=" + urllib.parse.quote(symbol)
                      req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "ALIGN-bridge-preflight"})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      if payload.get("ok") is not True or not isinstance(payload.get("snapshots"), dict):
                          raise ValueError("réponse API invalide")
                      snapshots = payload["snapshots"]
                      fresh = [tf for tf, snap in snapshots.items() if isinstance(snap, dict) and snap.get("fresh") is True]
                      active = payload.get("activeTimeframe") or "aucune"
                      if not fresh:
                          status = "DEGRADED"
                          details.append(symbol + ": aucun snapshot frais")
                      print(f"BRIDGE symbol={symbol} active={active} fresh={','.join(fresh) or 'NONE'}")
                  except Exception as exc:
                      status = "DEGRADED"
                      details.append(symbol + ": " + type(exc).__name__)
          print("BRIDGE_STATUS=" + status)
          for detail in details:
              print("::warning::TradingView bridge " + detail)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## TradingView ROBOT V12 — état du bridge\\n\\n")
                  f.write("- **Statut :** " + status + "\\n")
                  f.write("- **Détail :** " + (" ; ".join(details) if details else "BTCUSD et XAUUSD contrôlés") + "\\n")
                  f.write("- **Conséquence :** si le bridge est indisponible, ALIGN utilise son moteur interne ; aucune donnée TradingView n'est revendiquée.\\n")
          PY

      - name: Analyse BTC + Gold et envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
          DUREE_SEC: "21000"
          PAUSE_SEC: "5"
        run: python3 align_bot.py

      - name: Sauver la mémoire du robot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
