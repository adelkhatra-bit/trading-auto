name: ALIGN MTF BOT (signaux BTC + Gold Telegram)
# Release trigger after verified cleanup of the previous production worker.

on:
  # Les pushes sont validés par align-bot-validation.yml. Le worker ne redémarre
  # qu'après la réussite de cette validation, via workflow_run.
  workflow_run:
    workflows: ["ALIGN MTF validation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  # Un seul worker de production. Sur push, ce workflow ne démarre qu'après
  # le succès du workflow de validation indépendant.
  group: align-bot
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/align-bot-validation.yml

  signaux:
    needs: validate
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
         needs.validate.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: align-bot
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: align-bot

      - name: Récupérer la mémoire du robot
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
          restore-keys: align-etat-

      - name: Contrôler la mémoire restaurée sans afficher d'identifiants
        working-directory: align-bot
        env:
          CACHE_MATCHED_KEY: ${{ steps.restore_state.outputs.cache-matched-key }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "state.json"
          report = {
              "cache_matched_key": os.environ.get("CACHE_MATCHED_KEY", "") or "NONE",
              "state_file_present": os.path.isfile(path),
          }
          if os.path.isfile(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      state = json.load(f)
                  report["state_json_valid"] = isinstance(state, dict)
                  if isinstance(state, dict):
                      report["schema_version"] = state.get("schema_version", state.get("version", "unknown"))
                      report["subscriber_count"] = len(state.get("chats", []))
                      report["prospect_count"] = len(state.get("prospects", []))
                      report["telegram_offset_present"] = state.get("offset") is not None
                      report["btc_open_trade"] = bool((state.get("BTC") or {}).get("trade"))
                      report["gold_open_trade"] = bool((state.get("GOLD") or {}).get("trade"))
                      report["btc_auto_follow_count"] = len((state.get("auto") or {}).get("BTC", []))
                      report["gold_auto_follow_count"] = len((state.get("auto") or {}).get("GOLD", []))
              except Exception as exc:
                  report["state_json_valid"] = False
                  report["parse_error"] = type(exc).__name__
          with open("state-audit.txt", "w", encoding="utf-8") as f:
              for key, value in report.items():
                  f.write(f"{key}={value}\\n")
          for key, value in report.items():
              print(f"ALIGN_STATE_AUDIT {key}={value}")
          PY

      - name: Publier le contrôle mémoire (sans données personnelles)
        uses: actions/upload-artifact@v4
        with:
          name: align-state-audit-${{ github.run_id }}
          path: align-bot/state-audit.txt
          retention-days: 1

      - name: Vérifier la connexion à Telegram sans envoyer de message
        working-directory: align-bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          if not token:
              raise SystemExit("ÉCHEC: secret TELEGRAM_TOKEN absent")
          url = "https://api.telegram.org/bot" + token + "/getMe"
          req = urllib.request.Request(url)
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode())
          if not payload.get("ok"):
              raise SystemExit("ÉCHEC: API Telegram indisponible")
          info_url = "https://api.telegram.org/bot" + token + "/getWebhookInfo"
          with urllib.request.urlopen(urllib.request.Request(info_url), timeout=20) as response:
              info = json.loads(response.read().decode())
          if not info.get("ok"):
              raise SystemExit("ÉCHEC: impossible de vérifier le mode de réception Telegram")
          webhook = (info.get("result") or {}).get("url", "").strip()
          if webhook:
              delete_url = "https://api.telegram.org/bot" + token + "/deleteWebhook?drop_pending_updates=false"
              with urllib.request.urlopen(urllib.request.Request(delete_url), timeout=20) as response:
                  deleted = json.loads(response.read().decode())
              if not deleted.get("ok"):
                  raise SystemExit("ÉCHEC: webhook Telegram actif et suppression impossible; le polling ne peut pas démarrer.")
              print("TELEGRAM_WEBHOOK_REMOVED pending_updates_preserved=true")
              with urllib.request.urlopen(urllib.request.Request(info_url), timeout=20) as response:
                  verified = json.loads(response.read().decode())
              if not verified.get("ok") or (verified.get("result") or {}).get("url", "").strip():
                  raise SystemExit("ÉCHEC: le webhook Telegram est toujours actif après suppression.")
          print("TELEGRAM_API_OK bot=@" + payload["result"].get("username", "unknown"))
          print("TELEGRAM_RECEIVE_MODE=polling webhook=none")
          print("Aucun message de démarrage envoyé aux utilisateurs.")
          PY

      - name: Vérifier une connexion IA réelle (même chaîne que le bot)
        # Pas de démarrage production si aucun fournisseur IA externe ne répond : pas de faux avis IA.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 ai_healthcheck.py

      - name: Vérifier le bridge TradingView ROBOT V12 (BTC + GOLD)
        # Pas de faux raccordement : le bot ne démarre pas si les deux flux Pine actifs ne sont pas frais.
        env:
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = os.environ.get("ALIGN_TV_API_URL", "").strip().rstrip("/")
          token = os.environ.get("ALIGN_TV_READ_TOKEN", "").strip()
          if not base or not token:
              raise SystemExit("ÉCHEC: secrets ALIGN_TV_API_URL / ALIGN_TV_READ_TOKEN absents — bridge TradingView non raccordé.")
          for symbol in ("BTCUSD", "XAUUSD"):
              url = base + "/bridge/robot-v12/mtf?symbol=" + urllib.parse.quote(symbol)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "User-Agent": "ALIGN-bridge-preflight"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("ok") is not True or not isinstance(payload.get("snapshots"), dict):
                  raise SystemExit("ÉCHEC: réponse bridge invalide pour " + symbol)
              active = str(payload.get("activeTimeframe") or "").upper()
              if payload.get("activeTimeframeFresh") is not True or active not in {"M1", "M5", "M15", "M30", "H1", "H2", "H4", "D1", "W1"}:
                  raise SystemExit("ÉCHEC: aucune unité TradingView active et fraîche pour " + symbol)
              snap = payload["snapshots"].get(active) or {}
              robot = snap.get("robotV12") or {}
              if snap.get("fresh") is not True or not isinstance(robot, dict) or not robot:
                  raise SystemExit("ÉCHEC: snapshot actif frais ou données ROBOT V12 absents pour " + symbol)
              directions = [robot.get(k) for k in ("lecture_1m", "lecture_5m", "lecture_15m", "lecture_60m")]
              if not any(v not in (None, "") for v in directions):
                  raise SystemExit("ÉCHEC: aucune lecture MTF ROBOT V12 exploitable pour " + symbol)
              print(f"BRIDGE_CONFIRMED symbol={symbol} active={active} age_ms={payload.get('activeTimeframeAgeMs')} received={','.join(payload.get('receivedTimeframes', []))} fresh_snapshot=true robot_v12=true")
          PY

      - name: Analyse BTC + Gold et envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIGN_TV_API_URL: ${{ secrets.ALIGN_TV_API_URL }}
          ALIGN_TV_READ_TOKEN: ${{ secrets.ALIGN_TV_READ_TOKEN }}
          DUREE_SEC: "21000"
          PAUSE_SEC: "5"
        run: python3 align_bot.py

      - name: Sauver la mémoire du robot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
