name: ALIGN MTF BOT (signaux BTC + Gold Telegram)

on:
  push:
    branches: [main]
    paths: ["align-bot/**", ".github/workflows/align-bot.yml", ".github/workflows/align-bot-validation.yml"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: align-bot
  # Ne pas tuer un worker de 5 h 40 à cause d'un push ou d'un déclenchement planifié concurrent.
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/align-bot-validation.yml

  signaux:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: align-bot
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: align-bot

      - name: Récupérer la mémoire du robot
        uses: actions/cache/restore@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}
          restore-keys: align-etat-

      - name: Vérifier la connexion à Telegram sans envoyer de message
        working-directory: align-bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          if not token:
              raise SystemExit("ÉCHEC: secret TELEGRAM_TOKEN absent")
          url = "https://api.telegram.org/bot" + token + "/getMe"
          req = urllib.request.Request(url)
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode())
          if not payload.get("ok"):
              raise SystemExit("ÉCHEC: API Telegram indisponible")
          print("TELEGRAM_API_OK bot=@" + payload["result"].get("username", "unknown"))
          print("Aucun message de démarrage envoyé aux utilisateurs.")
          PY

      - name: Vérifier une connexion IA réelle (même chaîne que le bot)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 ai_healthcheck.py

      - name: Analyse BTC + Gold et envoi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DUREE_SEC: "20400"
          PAUSE_SEC: "5"
        run: python3 align_bot.py

      - name: Sauver la mémoire du robot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: align-bot/state.json
          key: align-etat-${{ github.run_id }}

      - name: Alerter les administrateurs si le robot échoue ou est annulé
        if: always() && (failure() || cancelled())
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          if not token:
              print("Alerte Telegram impossible: TELEGRAM_TOKEN absent")
              raise SystemExit(0)
          recipients = set()
          try:
              with open("state.json", encoding="utf-8") as f:
                  state = json.load(f)
              recipients.update(str(x) for x in state.get("proprio", []) if str(x).strip())
          except Exception as exc:
              print("Mémoire propriétaire indisponible:", type(exc).__name__)
          fallback = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if fallback:
              recipients.add(fallback)
          if not recipients:
              print("Aucun destinataire administrateur disponible")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "failure").upper()
          message = (
              "⚠️ ALIGN — ALERTE TECHNIQUE\n"
              f"Le workflow du robot est {status}.\n"
              "Aucune entrée broker n'a été envoyée par cette alerte.\n"
              "Consulte les journaux GitHub pour le diagnostic.\n"
              + os.environ.get("RUN_URL", "")
          )
          for chat_id in recipients:
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
              req = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  data=data,
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      print("ALERT_SENT", chat_id, response.status)
              except Exception as exc:
                  print("ALERT_FAILED", chat_id, type(exc).__name__)
          PY
